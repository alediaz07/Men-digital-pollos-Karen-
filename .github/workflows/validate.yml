name: Validate Pollos Karen
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:cloudflare
      - run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
